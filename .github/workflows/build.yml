name: Build and deploy Hamemo
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-key

  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Validate Cloudflare credentials without exposing them
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          API_TOKEN="$RAW_CLOUDFLARE_API_TOKEN"
          ACCOUNT_ID="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [ -z "$API_TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret."
            exit 1
          fi
          if [[ "$API_TOKEN" =~ [[:space:]\"\'] ]] || [[ "$API_TOKEN" == *curl* ]] || [[ "$API_TOKEN" == *http* ]] || [[ "$API_TOKEN" == *Authorization* ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not a raw API token. Replace it with a newly created Cloudflare API token only; do not paste a curl command."
            exit 1
          fi
          if [[ ! "$ACCOUNT_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID contains invalid characters. Copy the Account ID only."
            exit 1
          fi
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$API_TOKEN" >> "$GITHUB_ENV"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "Cloudflare credential format checks passed; values were not printed."
      - name: Deploy latest app
        run: npm run deploy
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-key
